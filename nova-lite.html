<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rowan Lite · AI Mentor</title>
<!-- ============================================================
 * ROWAN LITE — a simple AI mentor for the dashboard.
 *
 * HOW IT WORKS:
 *   • Calls the server-side /api/claude proxy (same origin). The
 *     Anthropic key lives in a Vercel env var, never in the browser.
 *   • Rowan reads dashboard context from localStorage, but skips any
 *     credential-shaped keys (token/secret/key/password/auth) so no
 *     secrets are ever sent to the model.
 *   • Flat CSS orb (no 3D), basic chat.
 * ============================================================ -->
<link rel="stylesheet" href="theme.css">
<script src="anim.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* page centering — match the .page convention; theme.css owns the body bg */
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 22px 80px; }

/* ---- editorial header ---- */
.top { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
.title h1 {
  font-family: var(--sans); font-weight: 700; line-height: .9; letter-spacing: -.035em;
  text-transform: uppercase; font-size: clamp(34px, 8vw, 56px); color: var(--ink);
}
.title h1 .thin { color: var(--faint); font-weight: 400; }
.title .role {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted); margin-top: 8px;
}
.title .role .idx { color: var(--accent); }

/* ---- flat CSS orb avatar (lightweight, no Three.js) — coral signal ---- */
.orb { width: 58px; height: 58px; border-radius: 50%; position: relative; flex-shrink: 0;
  background: radial-gradient(circle at 32% 28%, #ffd9cb, var(--accent) 46%, #8c2c12 100%);
  border: 1px solid var(--line);
  animation: orbFloat 4s ease-in-out infinite; }
.orb::before, .orb::after { content: ''; position: absolute; top: 38%; width: 8px; height: 8px; border-radius: 50%;
  background: #2a0f06; transition: height .15s; }
.orb::before { left: 30%; } .orb::after { right: 30%; }
.orb.think { animation: orbFloat 1.1s ease-in-out infinite, orbPulse 1.1s ease-in-out infinite; }
.orb.happy::before, .orb.happy::after { height: 3.5px; border-radius: 0 0 8px 8px; }
@keyframes orbFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes orbPulse { 0%,100% { transform: translateY(0) scale(1) } 50% { transform: translateY(-3px) scale(1.06) } }

/* ---- chat ---- */
.feed { display: flex; flex-direction: column; gap: 16px; margin-bottom: 22px; }
.msg { max-width: 90%; }
.msg.user { align-self: flex-end; }
.msg.coach { align-self: flex-start; width: 100%; }
.bubble { padding: 14px 16px; font-size: 14.5px; line-height: 1.6; font-family: var(--sans); }
.msg.user .bubble {
  background: var(--raise); border: 1px solid var(--line); color: var(--ink);
}
.msg.coach .bubble {
  background: transparent; border: 1px solid var(--line); border-left: 2px solid var(--accent);
  color: var(--ink);
}
.tag {
  display: inline-block; margin-bottom: 11px; font-family: var(--mono);
  font-size: 9.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--accent);
}
.tag::before { content: "[ "; } .tag::after { content: " ]"; }
.bubble b, .pill { color: var(--accent); font-weight: 700; }
.pill { font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
.reply-list { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.reply-list li { line-height: 1.5; position: relative; padding-left: 20px; }
.reply-list li::before {
  content: ""; position: absolute; left: 0; top: .55em; width: 8px; height: 1px; background: var(--accent);
}
.dots { display: inline-flex; gap: 6px; align-items: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .4; animation: d 1.2s ease-in-out infinite; }
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes d { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

/* ---- composer ---- */
.composer { display: flex; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.composer input {
  flex: 1; background: var(--raise); border: 1px solid var(--line); color: var(--ink);
  padding: 14px 16px; font-size: 14.5px; outline: none; font-family: var(--sans);
}
.composer input::placeholder { color: var(--faint); }
.composer input:focus { border-color: var(--accent); }
.composer button {
  width: 54px; border: 0; cursor: pointer; color: #FFF; background: var(--accent);
  font-size: 18px; font-family: var(--sans); transition: transform .12s;
}
.composer button:active { transform: scale(.94); }

@media (max-width: 480px) {
  .wrap { padding: 28px 16px 64px; }
  .msg { max-width: 100%; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top reveal">
      <div class="orb" id="orb"></div>
      <div class="title">
        <h1>Rowan <span class="thin">Lite</span></h1>
        <div class="role"><span class="idx">[00]</span> &nbsp;Your Mentor</div>
      </div>
    </div>

    <div class="sec-h reveal">
      <span class="n">01</span>
      <h2>Session</h2>
      <div class="rule"></div>
      <span class="meta">AI · /api/claude</span>
    </div>

    <div class="feed" id="feed"></div>

    <div class="composer reveal">
      <input id="chatInput" placeholder="ASK ROWAN ANYTHING…" autocomplete="off" />
      <button id="send" aria-label="Send">→</button>
    </div>
  </div>

<script>
(function(){
  const feed = document.getElementById('feed');
  const input = document.getElementById('chatInput');
  const orb = document.getElementById('orb');

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function setOrb(s){ orb.className = 'orb' + (s ? ' ' + s : ''); }

  // ---- read whatever the dashboard stored (for context) ----
  function dashboardData(){
    const out = {};
    const SKIP = /token|secret|api[_-]?key|password|auth/i; // never send credentials to the model
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (SKIP.test(k)) continue;
      try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(e){ out[k] = localStorage.getItem(k); }
    }
    return out;
  }

  // ---- render: bullets + **pills** ----
  function inlineMarks(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="pill">$1</span>'); }
  function render(text){
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const items = [], loose = [];
    for (const l of lines){
      if (/^[-•*]\s+/.test(l)) items.push('<li>' + inlineMarks(l.replace(/^[-•*]\s+/, '')) + '</li>');
      else loose.push(inlineMarks(l));
    }
    let html = loose.join('<br>');
    if (items.length) html += (html ? '<br>' : '') + '<ul class="reply-list">' + items.join('') + '</ul>';
    return html;
  }
  function addUser(t){ const e = document.createElement('div'); e.className = 'msg user'; e.innerHTML = '<div class="bubble">' + esc(t) + '</div>'; feed.appendChild(e); scroll(); }
  function addCoach(html){ const e = document.createElement('div'); e.className = 'msg coach'; e.innerHTML = '<div class="bubble"><span class="tag">Rowan</span><div>' + html + '</div></div>'; feed.appendChild(e); scroll(); return e; }
  function scroll(){ window.scrollTo(0, document.body.scrollHeight); }

  const SYS =
    "You are Rowan, a personal mentor living inside the user's life-tracking dashboard. " +
    "You can see their saved data (food, water, gym, finance, sleep, goals, etc.). " +
    "Give honest, specific, encouraging guidance. " +
    "Answer in short bullet points starting with '- ', few words each, plain language. " +
    "Wrap key words and numbers in **double asterisks**. " +
    "End with one '- Do today:' bullet giving the single action. " +
    "Dashboard data as JSON:\n";

  let busy = false;
  async function ask(text){
    text = (text||'').trim(); if (!text || busy) return;
    busy = true; addUser(text); input.value = '';
    setOrb('think');
    const loading = addCoach('<span class="dots"><i></i><i></i><i></i></span>');
    try {
      const res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-opus-4-8',
          max_tokens: 1024,
          system: SYS + JSON.stringify(dashboardData()),
          messages: [{ role: 'user', content: text }],
        }),
      });
      const json = await res.json();
      if (json.error){ loading.querySelector('div:last-child').innerHTML = render('- ' + (json.error.message || 'Something went wrong — check your API key.')); setOrb(''); busy = false; return; }
      const reply = (json.content && json.content[0] && json.content[0].text) || 'Hmm, no reply.';
      loading.querySelector('div:last-child').innerHTML = render(reply);
      setOrb('happy'); setTimeout(() => setOrb(''), 2500);
    } catch(e){
      loading.querySelector('div:last-child').innerHTML = render('- Could not reach Anthropic — check your connection and key.');
      setOrb('');
    }
    busy = false;
  }

  document.getElementById('send').addEventListener('click', () => ask(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(input.value); });

  addCoach('Hey — I am <b>Rowan</b>. Ask me about food, training, sleep, or where to start. I keep it short and give you <b>one thing to act on</b>.');
})();
</script>
</body>
</html>
