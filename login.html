<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E7">
<title>Sign in — Lucas°</title>
<link rel="stylesheet" href="theme.css">
<style>
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;padding:32px 28px}
.auth-brand{font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink);margin-bottom:auto;padding-top:6px}
.auth-brand .dot{color:var(--accent)}
.auth-kicker{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:16px}
.auth-kicker .idx{color:var(--accent)}
.auth-title{font-size:clamp(40px,12vw,64px);font-weight:700;line-height:.9;letter-spacing:-.035em;text-transform:uppercase;color:var(--ink);margin:0 0 36px}
.auth-title .thin{color:var(--faint);font-weight:400}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input{width:100%;padding:14px 15px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-family:var(--mono);font-size:15px;outline:none;transition:border-color .2s}
.field input::placeholder{color:var(--faint)}
.field input:focus{border-color:var(--accent)}
.auth-btn{width:100%;margin-top:8px;padding:15px;border:0;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;cursor:pointer;transition:filter .15s,transform .1s}
.auth-btn:hover{filter:brightness(1.06)}
.auth-btn:active{transform:translateY(1px)}
.auth-btn:disabled{opacity:.6;cursor:default}
.auth-err{min-height:18px;margin-top:14px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.auth-foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint)}
.auth-foot .pd{margin-right:7px}
</style>
</head>
<body>
<div class="auth">
  <div class="auth-brand">LUCAS<span class="dot">°</span></div>

  <div>
    <div class="auth-kicker"><span class="idx">[00]</span> &nbsp; PRIVATE DASHBOARD &nbsp; / &nbsp; SIGN IN</div>
    <h1 class="auth-title">Welcome<br><span class="thin">back.</span></h1>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="auth-btn" id="loginBtn" type="submit">Enter</button>
      <div class="auth-err" id="loginErr"></div>
    </form>
  </div>

  <div class="auth-foot">
    <span><span class="pd"></span>Encrypted session</span>
    <span>Lucas° 2026</span>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginErr');

  function safeNext() {
    var n = new URLSearchParams(location.search).get('next') || '/';
    // only allow same-origin absolute paths (no //evil.com, no http://)
    if (typeof n !== 'string' || n[0] !== '/' || n[1] === '/') return '/';
    return n;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      if (r.ok) { window.location.href = safeNext(); return; }
      var j = await r.json().catch(function () { return {}; });
      err.textContent = j.error || 'Incorrect username or password';
    } catch (e2) {
      err.textContent = 'Could not reach the server — try again';
    }
    btn.disabled = false; btn.textContent = 'Enter';
  });
})();
</script>
</body>
</html>
