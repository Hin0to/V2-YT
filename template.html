<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================= -->
<!--  DASHBOARD SECTION TEMPLATE  (editorial system)               -->
<!--                                                                -->
<!--  Copy this file to start a new page, OR copy one of the        -->
<!--  "card" blocks below into an existing page to add a section.   -->
<!--  Everything here uses the shared theme.css tokens, fonts and   -->
<!--  cloud-sync as the rest of the dashboard, so anything you      -->
<!--  build will automatically match the design.                    -->
<!--                                                                -->
<!--  QUICK START                                                   -->
<!--   1. Rename the <title> and the .title below.                  -->
<!--   2. Find the block marked "COPY FROM HERE" and duplicate it   -->
<!--      to make as many sections as you want.                     -->
<!--   3. Give each section its own SECTION_ID (see the script at   -->
<!--      the bottom) so it saves + syncs independently.            -->
<!--                                                                -->
<!--  DESIGN: editorial / Swiss. Use the .sec-h section header      -->
<!--  pattern, mono indices ("01"), oversized grotesk titles, the   -->
<!--  coral var(--accent), and hairline var(--line) rules. Add      -->
<!--  .reveal / .stagger / data-count hooks for the scroll          -->
<!--  animations (engine = anim.js).                                -->
<!-- ============================================================= -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E7">
<title>New Section · Dashboard</title>

<!-- Shared dashboard theme FIRST, then this page's own <style>. -->
<link rel="stylesheet" href="theme.css">

<!-- Shared dashboard scripts. Keep these in this order. -->
<script src="sync.js" defer></script>     <!-- cloud sync across devices -->
<script src="topbar.js" defer></script>   <!-- top water bar + bottom tab nav -->
<script src="anim.js" defer></script>     <!-- scroll reveals, count-ups, ticks -->

<style>
/* ============================================================= */
/*  PAGE STYLES — consume the shared tokens from theme.css        */
/*  (var(--ink), var(--muted), var(--accent), var(--line), …).    */
/*  Don't redefine colors here; the warm gradient canvas lives    */
/*  on <body> in theme.css. Keep the .page wrapper for centering. */
/* ============================================================= */
.page { max-width: 1100px; margin: 0 auto; padding: 30px 36px 96px; }
@media (max-width: 560px) { .page { padding: 24px 18px 96px; } }

/* Big editorial page title (oversized uppercase grotesk). */
.title {
  font-family: var(--sans);
  font-size: clamp(40px, 8vw, 88px);
  font-weight: 700; line-height: .9; letter-spacing: -.035em;
  text-transform: uppercase; color: var(--ink);
  margin: 18px 0 0;
}
.title .thin { color: var(--faint); font-weight: 400; }

/* THE CARD — flat, hairline-bordered, small radius. Main block. */
.gm-card {
  position: relative;
  background: var(--raise);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 22px;
  margin-bottom: 14px;
}

/* Card header: an eyebrow label + a big number. */
.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-family: var(--mono);
  font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .18em; color: var(--muted); margin-bottom: 8px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-family: var(--sans);
  font-size: 52px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.045em; color: var(--ink); line-height: .9;
}
.gm-progress-total { font-family: var(--mono); font-size: 18px; color: var(--faint); }
.gm-progress-label {
  font-family: var(--mono);
  font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .16em; color: var(--muted); margin-left: 6px;
}

/* A little squared "pill" — handy for streaks, tags, statuses. */
.gm-streak {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 12px; border-radius: 2px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
}

/* Stat grid — a row of metrics. Auto-wraps on small screens. */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 0;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.stat {
  padding: 16px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.stat-num {
  font-family: var(--sans);
  font-size: 30px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em; color: var(--ink); line-height: 1;
}
.stat-label {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 9.5px; text-transform: uppercase;
  letter-spacing: .12em; color: var(--muted);
}

/* List rows with a checkbox + editable text + delete button. */
.goal-list { list-style: none; margin: 0; padding: 0; }
.empty-state {
  font-family: var(--mono);
  text-align: center; font-size: 11px; text-transform: uppercase;
  letter-spacing: .12em; color: var(--faint); padding: 16px 0;
}
.gm-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  transition: opacity .3s, background .2s;
}
.gm-row:hover { background: var(--raise); }
.gm-row.gm-row-done { opacity: .5; }
.gm-row.gm-row-done .gm-text {
  text-decoration: line-through; text-decoration-color: var(--faint);
}
/* Checkbox box — squared, fills coral when checked. Also wired to
   the .tick-box animation hook in theme.css. */
.gm-check {
  appearance: none; -webkit-appearance: none;
  width: 20px; height: 20px; flex-shrink: 0; margin: 0;
  border: 1.5px solid var(--line);
  background: transparent; border-radius: 3px;
  position: relative; cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s;
}
.gm-check:checked {
  background: var(--accent); border-color: var(--accent);
}
.gm-check:checked::after {
  content: ''; position: absolute; left: 6px; top: 2px;
  width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.gm-text {
  flex: 1; font-family: var(--sans);
  font-size: 15px; color: var(--ink);
  outline: none; border-radius: 2px; padding: 2px 4px; margin: -2px -4px;
}
.gm-text[contenteditable="true"]:focus {
  outline: 1px solid var(--accent); background: var(--raise);
}
.goal-delete {
  border: 0; background: transparent; color: var(--faint);
  font-family: var(--mono);
  font-size: 18px; cursor: pointer; padding: 0 4px;
  opacity: .5; transition: opacity .2s, color .2s;
}
.gm-row:hover .goal-delete { opacity: 1; }
.goal-delete:hover { color: var(--accent); }

/* Add-item input row + buttons. */
.gm-input-wrap {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--line);
}
.gm-input {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 3px; background: transparent;
  color: var(--ink);
  font-family: var(--mono); font-size: 13px; outline: none;
  transition: border-color .2s;
}
.gm-input::placeholder { color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
.gm-input:focus { border-color: var(--accent); }

/* Primary (coral) button. */
.gm-add {
  padding: 12px 22px; border: 0; border-radius: 3px;
  background: var(--accent);
  color: #fff; font-family: var(--mono);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
  cursor: pointer;
  transition: filter .15s, transform .1s;
}
.gm-add:hover { filter: brightness(1.06); }
.gm-add:active { transform: translateY(1px); }

/* Secondary (ghost) button. */
.gm-ghost {
  padding: 12px 20px;
  border: 1px solid var(--line);
  border-radius: 3px; background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.gm-ghost:hover { background: var(--raise); border-color: var(--ink); }

@media (max-width: 480px) {
  .gm-card { padding: 18px; }
  .gm-progress-num { font-size: 42px; }
}
</style>
</head>
<body>
<div class="page">

  <!-- Hero / page title. Rename this. -->
  <section class="hero reveal">
    <div class="kicker"><span class="idx">[00]</span> &nbsp; NEW SECTION &nbsp; / &nbsp; DASHBOARD</div>
    <h1 class="title">New<br><span class="thin">Section.</span></h1>
  </section>


  <!-- =========================================================== -->
  <!--  EXAMPLE 1 — STAT CARD                                       -->
  <!--  A header number plus a row of metrics. Pure HTML, no JS.    -->
  <!--  COPY FROM HERE ↓                                            -->
  <!-- =========================================================== -->
  <div class="section reveal">
    <div class="sec-h"><span class="n">01</span><h2>Overview</h2><div class="rule"></div><span class="meta">This week</span></div>
    <div class="gm-card">
      <div class="gm-header">
        <div class="gm-header-left">
          <div class="gm-eyebrow">This Week</div>
          <div class="gm-progress-row">
            <span class="gm-progress-num" data-count="87">87</span>
            <span class="gm-progress-total">/ 100</span>
            <span class="gm-progress-label">score</span>
          </div>
        </div>
        <span class="gm-streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>5 day streak</span>
      </div>

      <div class="stat-grid stagger">
        <div class="stat"><div class="stat-num"><span data-count="12">12</span></div><div class="stat-label">Workouts</div></div>
        <div class="stat"><div class="stat-num"><span data-count="7.4" data-dec="1">7.4</span><small>h</small></div><div class="stat-label">Avg Sleep</div></div>
        <div class="stat"><div class="stat-num">2.1k</div><div class="stat-label">Calories</div></div>
        <div class="stat"><div class="stat-num"><span data-count="94">94</span><small>%</small></div><div class="stat-label">Hydration</div></div>
      </div>
    </div>
  </div>
  <!-- ↑ COPY TO HERE -->


  <!-- =========================================================== -->
  <!--  EXAMPLE 2 — EDITABLE LIST (saves + syncs automatically)     -->
  <!--  Add items, check them off, edit text, delete. Everything    -->
  <!--  is saved to this browser AND synced to your other devices.  -->
  <!--  COPY FROM HERE ↓                                            -->
  <!-- =========================================================== -->
  <div class="section reveal">
    <div class="sec-h"><span class="n">02</span><h2>My List</h2><div class="rule"></div><span class="meta">Synced</span></div>
    <div class="gm-card">
      <ul class="goal-list" id="itemList"></ul>

      <div class="gm-input-wrap">
        <input class="gm-input" id="itemInput" type="text"
               placeholder="Add an item…" autocomplete="off">
        <button class="gm-add" id="itemAdd" type="button">Add</button>
      </div>
    </div>
  </div>
  <!-- ↑ COPY TO HERE -->

</div><!-- /.page -->

<script>
/* =============================================================== */
/*  EXAMPLE 2 LOGIC — the editable list above.                     */
/*                                                                 */
/*  HOW IT SAVES + SYNCS:                                          */
/*   • SECTION_ID is the unique name for this section's data.      */
/*     If you copy this block to make a NEW section, give it a     */
/*     DIFFERENT SECTION_ID (e.g. 'books', 'habits') so the two    */
/*     lists don't overwrite each other.                           */
/*   • We save to localStorage (this device) and then hand the     */
/*     key to initCloudSync(), which mirrors it to every device    */
/*     via Supabase — exactly like the other dashboard pages.      */
/* =============================================================== */
(function () {
  'use strict';

  // NOTE: Change this when you copy the block to make a new section.
  const SECTION_ID = 'template_list';

  const STORE_KEY = 'tpl:' + SECTION_ID; // localStorage key for this list

  const listEl  = document.getElementById('itemList');
  const inputEl = document.getElementById('itemInput');
  const addEl   = document.getElementById('itemAdd');

  // --- load / save -------------------------------------------------
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save(items) {
    // Writing to localStorage automatically triggers a cloud-sync push
    // (see initCloudSync at the bottom).
    localStorage.setItem(STORE_KEY, JSON.stringify(items));
  }

  // --- render ------------------------------------------------------
  function render() {
    const items = load();
    listEl.innerHTML = '';

    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'Nothing here yet — add your first item below.';
      listEl.appendChild(li);
      return;
    }

    items.forEach(function (item, i) {
      const li = document.createElement('li');
      // Keep gm-row / gm-row-done (the JS hooks) AND add .tick so the
      // theme.css check-off animation fires. theme.css animates on .done,
      // so mirror the done state onto that class too.
      li.className = 'gm-row tick' + (item.done ? ' gm-row-done done' : '');

      // checkbox
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'gm-check tick-box';
      cb.checked = !!item.done;
      cb.addEventListener('change', function () {
        const list = load(); list[i].done = cb.checked; save(list); render();
      });

      // editable text
      const txt = document.createElement('div');
      txt.className = 'gm-text tick-label';
      txt.textContent = item.text;
      txt.contentEditable = 'true';
      txt.addEventListener('blur', function () {
        const list = load(); list[i].text = txt.textContent.trim(); save(list);
      });
      txt.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); txt.blur(); }
      });

      // delete
      const del = document.createElement('button');
      del.className = 'goal-delete';
      del.type = 'button';
      del.textContent = '×';
      del.addEventListener('click', function () {
        const list = load(); list.splice(i, 1); save(list); render();
      });

      li.append(cb, txt, del);
      listEl.appendChild(li);
    });
  }

  // --- add ---------------------------------------------------------
  function add() {
    const text = inputEl.value.trim();
    if (!text) return;
    const list = load();
    list.push({ text: text, done: false });
    save(list);
    inputEl.value = '';
    render();
  }
  addEl.addEventListener('click', add);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') add();
  });

  render();

  // --- cloud sync --------------------------------------------------
  // Mirrors STORE_KEY to all your devices. `appKey` is this page's row
  // in Supabase — give each NEW page its own appKey. onApplied re-draws
  // the list when an update arrives from another device.
  if (window.initCloudSync) {
    window.initCloudSync({
      appKey: 'template',          // <-- unique per page (e.g. 'reading', 'habits')
      syncedKeys: [STORE_KEY],     // exact localStorage keys to sync
      // syncedPrefixes: ['tpl:'], // …or sync every key starting with a prefix
      onApplied: render
    });
  }
})();
</script>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  CHEAT SHEET — editorial building blocks you can copy anywhere ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  Section header (01 — TITLE ———— meta):                        ║
  ║    <div class="sec-h"><span class="n">01</span>                ║
  ║      <h2>My Heading</h2><div class="rule"></div>               ║
  ║      <span class="meta">note</span></div>                      ║
  ║                                                                ║
  ║  Card wrapper:                                                 ║
  ║    <div class="gm-card"> …your content… </div>                 ║
  ║                                                                ║
  ║  Big number / KPI (counts up on scroll-in):                    ║
  ║    <span class="gm-progress-num" data-count="42">42</span>     ║
  ║                                                                ║
  ║  Metric tiles:                                                 ║
  ║    <div class="stat-grid stagger">                             ║
  ║      <div class="stat"><div class="stat-num">                  ║
  ║        <span data-count="7">7</span></div>                     ║
  ║        <div class="stat-label">Label</div></div>               ║
  ║    </div>                                                      ║
  ║                                                                ║
  ║  Pill / tag:   <span class="gm-streak"><svg.../>Tag</span>     ║
  ║  Buttons:      <button class="gm-add">Primary</button>         ║
  ║                <button class="gm-ghost">Secondary</button>     ║
  ║  Input:        <input class="gm-input" placeholder="…">        ║
  ║                                                                ║
  ║  Animation hooks (engine = anim.js):                          ║
  ║    .reveal            block fades + rises on scroll-in         ║
  ║    .stagger           its children reveal in sequence          ║
  ║    data-count="68"    number counts up (data-dec="1" → 1 dp)   ║
  ║    .tick/.tick-box/.tick-label  satisfying check-off           ║
  ║                                                                ║
  ║  Colors — use the theme.css tokens, never hard-code:           ║
  ║    var(--ink)     headings / key numbers                       ║
  ║    var(--muted)   labels / hints                               ║
  ║    var(--faint)   faint captions                               ║
  ║    var(--accent)  the one coral signal accent (#E0512A)        ║
  ║    var(--line)    hairline rules / borders                     ║
  ║  On the dark gradient end add class .on-dark and use           ║
  ║    var(--inkD) / var(--mutedD) / var(--lineD) / var(--panelD)  ║
  ╚══════════════════════════════════════════════════════════════╝
-->
</body>
</html>
